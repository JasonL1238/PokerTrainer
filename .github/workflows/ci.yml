name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest

      # Schema and hash validation for every corpus artifact that is safe to
      # commit. Private recordings are never available here, so this checks the
      # manifest and answer keys only.
      - name: Validate corpus schemas and hashes
        run: python -m poker_tracker.validation --manifest validation/clubwpt_v1.json --skip-release-minimums

      # The fixture release gate must fail closed while the corpus is
      # incomplete. Exit 2 (setup invalid) is the expected, asserted result --
      # a green CI must never be mistaken for a passing release gate.
      - name: Release gate (fixture, expected to fail closed)
        run: |
          set +e
          python -m poker_tracker.release_gate --mode fixture --report-dir "$RUNNER_TEMP/release_reports" > "$RUNNER_TEMP/gate.json"
          code=$?
          set -e
          echo "release gate exit code: $code"
          if [ "$code" -eq 0 ]; then
            echo "::error::Release gate passed, but the committed corpus cannot satisfy the Phase 2 minimums. Something is failing open."
            exit 1
          fi

      - name: Retain release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-report
          path: ${{ runner.temp }}/release_reports/
          if-no-files-found: warn
