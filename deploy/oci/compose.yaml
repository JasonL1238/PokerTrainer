services:
  app:
    build:
      context: ../..
    image: pokertrainer:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8501"
      POKER_DB_PATH: /data/poker_tracker.db
      POKER_DATA_DIR: /data
      POKERTRAINER_REQUIRE_AUTH: "true"
      YOLO_CONFIG_DIR: /data/.ultralytics
    volumes:
      - /srv/pokertrainer/data:/data
    expose:
      - "8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
